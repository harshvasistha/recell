<!doctype html>
<html lang="en">
  <head>
    <style>vite-error-overlay { display: none !important; }</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recell - Sell Old Phone in 60s & Buy Certified Refurbished</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
      // Run this as early as physically possible - before the bundled
      // module script even parses - so the browser's own scroll-position
      // restore-on-reload/back-forward-nav never gets a chance to fire and
      // land the page somewhere other than the top (e.g. the footer, on a
      // long page). main.tsx sets this too, but that runs later once the
      // module script loads; setting it here as well is pure defense in
      // depth for browsers/navigation types where that turns out to be too
      // late.
      if ('scrollRestoration' in window.history) {
        window.history.scrollRestoration = 'manual';
      }

      function isExtErr(e) {
        if (!e) return false;
        var str = '';
        if (typeof e === 'string') {
          str = e.toLowerCase();
        } else if (e && e.message) {
          str = String(e.message).toLowerCase();
          if (e.stack) str += ' ' + String(e.stack).toLowerCase();
        } else {
          try { str = JSON.stringify(e).toLowerCase(); } catch(err) { str = String(e).toLowerCase(); }
        }
        return str.indexOf('ethereum') !== -1 || str.indexOf('metamask') !== -1;
      }
      
      window.addEventListener('error', function(event) {
        if (isExtErr(event.message) || isExtErr(event.error)) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
      
      window.addEventListener('unhandledrejection', function(event) {
        if (isExtErr(event.reason)) {
          event.preventDefault();
          event.stopPropagation();
          event.stopImmediatePropagation();
        }
      }, true);
      
      const origError = console.error;
      console.error = function() {
        var args = Array.prototype.slice.call(arguments);
        if (!args.some(isExtErr)) {
          origError.apply(console, args);
        }
      };
      const origWarn = console.warn;
      console.warn = function() {
        var args = Array.prototype.slice.call(arguments);
        if (!args.some(isExtErr)) {
          origWarn.apply(console, args);
        }
      };
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
